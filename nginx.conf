# =============================================================================
# Production Hardened Nginx Reverse Proxy with TLS 1.2/1.3 & OWASP Controls
# DEVELOPED by Akhil.A gmail :- akkedu01@gmail.com
# =============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version banner
    server_tokens off;

    # Logging format with correlation and security telemetry
    log_format security_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"correlation_id":"$http_x_correlation_id"'
    '}';

    access_log /var/log/nginx/access.log security_json;
    error_log /var/log/nginx/error.log warn;

    # TCP performance & buffer limits to mitigate Slowloris
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # Body Size Limits
    client_max_body_size 1m;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=api_simulation_zone:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit_zone:10m;

    # SSL / TLS Hardening Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    upstream cfd_backend_service {
        server cfd-backend:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # 1. HTTP to HTTPS Redirection
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge for Let's Encrypt certificates
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Production Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # Self-signed fallback or production certificate path
        ssl_certificate /etc/letsencrypt/live/cfd.local/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cfd.local/privkey.pem;

        # OWASP Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        limit_conn conn_limit_zone 20;

        # Frontend Static Single Page Application
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Simulation Trigger Endpoint (50MB payload limit allowed for STL)
        location ~ ^/api/(run-simulation|simulate) {
            limit_req zone=api_simulation_zone burst=3 nodelay;
            client_max_body_size 50m;

            proxy_pass http://cfd_backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # General Authenticated API Reverse Proxy
        location /api/ {
            limit_req zone=api_general_zone burst=20 nodelay;

            proxy_pass http://cfd_backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Health probes
        location ~ ^/(healthz|readyz) {
            proxy_pass http://cfd_backend_service;
            access_log off;
        }

        # Deny hidden files (.git, .env)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
