name: Production Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly security scan every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

jobs:
  static-analysis-and-audit:
    name: Dependency Audit & SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Lint Verification
        run: npm run lint

      - name: Run NPM Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file cfd-platform-sbom.json --output-format JSON
        continue-on-error: true

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: software-bill-of-materials
          path: cfd-platform-sbom.json
          retention-days: 30

  container-security:
    name: Container Build & Trivy Vulnerability Scan
    needs: static-analysis-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cfd-hardened-backend:${{ github.sha }}
          load: true

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cfd-hardened-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast-security-scan:
    name: OWASP ZAP Baseline Dynamic Scan
    needs: container-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Launch Mock Production Backend for DAST
        run: |
          npm ci
          node server.js &
          sleep 5
          curl -I http://localhost:3001/healthz

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3001/'
          cmd_options: '-a -j'
          fail_action: false
